<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 20" width="28" height="20" fill="none">
  <!-- Outer capsule matching Mapbox barrier marker -->
  <rect x="1" y="1" width="26" height="18" rx="4" fill="#ffffff" fill-opacity="0.92" stroke="#94a3b8" stroke-width="1.2" />
  <!-- Left post -->
  <line x1="5.5" y1="4.5" x2="5.5" y2="15.5" stroke="#475569" stroke-width="1.8" stroke-linecap="round" />
  <!-- Right post -->
  <line x1="22.5" y1="4.5" x2="22.5" y2="15.5" stroke="#475569" stroke-width="1.8" stroke-linecap="round" />
  <!-- Left swinging gate leaf (inward angled) -->
  <polygon points="5.5,6 12.5,7.5 12.5,14 5.5,14.5" fill="#94a3b8" stroke="#475569" stroke-width="1.1" stroke-linejoin="round" />
  <!-- Right swinging gate leaf (inward angled) -->
  <polygon points="22.5,6 15.5,7.5 15.5,14 22.5,14.5" fill="#94a3b8" stroke="#475569" stroke-width="1.1" stroke-linejoin="round" />
  <!-- Center barrier latch gap line -->
  <line x1="14" y1="6.5" x2="14" y2="15" stroke="#475569" stroke-width="0.8" stroke-dasharray="1.5,1" stroke-opacity="0.5" />
</svg>

